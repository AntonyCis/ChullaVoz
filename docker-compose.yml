version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentimenthub-postgres
    environment:
      POSTGRES_USER: sentimenthub_user
      POSTGRES_PASSWORD: Ghoststage#12
      POSTGRES_DB: sentimenthub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentimenthub_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentimenthub-api
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=sentimenthub_db;Username=sentimenthub_user;Password=Ghoststage#12"
      ASPNETCORE_ENVIRONMENT: Development
      HuggingFace__ApiKey: ""
    ports:
      - "5189:5189"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentimenthub-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data: